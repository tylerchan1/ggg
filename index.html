<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RE:EDUCATION</title><style>
*{box-sizing:border-box}body{margin:0;background:#131b26;color:#f3e9d4;font-family:system-ui,sans-serif}main{max-width:460px;margin:auto;padding:20px;min-height:100dvh}header{display:flex;justify-content:space-between;font-size:10px;letter-spacing:3px;color:#a4b2c1}h1{text-align:center;font:30px Georgia,serif;letter-spacing:3px;margin:20px 0 4px}.sub{text-align:center;color:#c4ab78;font-size:12px;letter-spacing:3px}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.meter{text-align:center;font-size:11px}.meter svg{width:30px;height:30px}.track{height:6px;background:#35404e;margin:7px 0;border-radius:4px;overflow:hidden}.fill{height:100%;transition:width .5s}.date{text-align:center;color:#d9b77a;font-size:12px;letter-spacing:3px;margin:14px}.news{background:#243140;border-left:2px solid #d9b77a;padding:11px 13px;font-size:12px;line-height:1.6;margin:0 0 15px}.news b{display:block;color:#d9b77a;font-size:10px;letter-spacing:2px}.card{position:relative;background:#eee5d0;color:#252d36;border-radius:9px;overflow:hidden;box-shadow:0 5px 0 #9d9077,0 10px 0 #39424d;touch-action:pan-y;transition:transform .15s;animation:appear .3s}.portrait svg{display:block;width:100%;height:185px}.person{text-align:center;color:#79684d;font-size:11px;letter-spacing:2px;margin-top:15px}.quote{text-align:center;font-size:17px;font-weight:650;line-height:1.65;padding:10px 20px 22px;word-break:keep-all}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}button{font:inherit;font-size:14px;cursor:pointer;border:1px solid #657283;background:#273646;color:#f3e9d4;border-radius:8px;padding:12px;line-height:1.5;word-break:keep-all}button:hover,button:focus-visible{background:#3c4e60;border-color:#d9b77a}button span{display:block;color:#d9b77a;font-size:20px}.full{width:100%;margin-top:14px}.hint{text-align:center;font-size:11px;color:#9ba7b5;margin:18px 0;line-height:1.6}.preview{position:absolute;top:15px;left:12px;right:12px;background:#14202de8;color:white;padding:12px;text-align:center;border:2px solid #e9dfc8;opacity:0;border-radius:5px;pointer-events:none}.report{background:#eee5d0;color:#29313b;padding:22px;border-radius:8px;line-height:1.7;font-size:14px}.report h2{font: bold 26px Georgia,serif;line-height:1.3}.report h3{font-size:15px;margin-bottom:4px}.report p{margin:5px 0 14px}.report hr{border:0;border-top:1px solid #b8ad97}.intro{text-align:center;line-height:1.8;padding:25px 10px}.intro p{color:#bcc8d2;font-size:14px}.mini{font-size:10px;letter-spacing:3px;color:#8a7352}.tag{display:inline-block;border:1px solid #b7a98d;padding:3px 7px;font-size:11px;border-radius:4px}.timeline{font-size:12px;padding-left:18px}.timeline li{margin:7px 0}@keyframes appear{from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><header><span>FUTURE EDUCATION LAB</span><span>03 / TEST</span></header><h1>RE:EDUCATION</h1><div class="sub">미래를 가르치는 사람</div><div id="app"></div></main><script>
const people={industry:['기업 대표','#36536c','#c49c79','#38303b','#738b9b',0],teacher:['현직 교사','#495e55','#e0b698','#49372c','#9ba57a',1],student:['학생 대표','#675777','#dfb48e','#37313e','#9784ae',2],press:['언론인','#78554b','#bd9477','#362e29','#ba8b62',0],eco:['생태학자','#365e50','#d9aa83','#3d4231','#86a57b',1],resident:['지역 주민','#77664f','#c9a17e','#b4afa1','#9f8866',0],graduate:['10년 전의 학생','#475b7b','#dfb48e','#37313e','#7895b7',2]};
function portrait(key){let [name,bg,skin,hair,coat,style]=people[key];return `<svg viewBox="0 0 380 185" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="185" fill="${bg}"/><circle cx="190" cy="92" r="76" fill="#f4dfb5" opacity=".12"/><circle cx="190" cy="92" r="64" fill="none" stroke="#f4dfb5" opacity=".35"/><path d="M18 18H362V167H18Z M28 28H352V157H28Z" stroke="#ead8aa" opacity=".25" fill="none"/><path d="M38 50l10-10 10 10-10 10Z M322 50l10-10 10 10-10 10Z" fill="#d9b77a"/><path d="M100 185 120 141 160 122H220L260 141 280 185Z" fill="${coat}"/><path d="M160 122 190 149 220 122 210 185H170Z" fill="#e9e0cc"/><path d="M174 100H206V132L190 143 174 132Z" fill="${skin}"/><path d="M150 48 166 29H212L231 49 225 94 210 114 190 122 170 114 155 94Z" fill="${skin}"/><path d="${style===1?'M145 112 142 49 159 26 195 20 225 32 238 53 233 115 220 122 226 59 204 40 176 52 155 53 158 117Z':style===2?'M149 65 141 44 158 24 195 18 221 30 239 48 226 65 213 46 194 57 172 43 157 65Z':'M149 67 145 43 163 27 201 22 229 37 235 59 222 64 212 45 187 53 163 44 156 65Z'}" fill="${hair}"/><path d="M163 67H180M200 67H217" stroke="${hair}" stroke-width="3"/><circle cx="172" cy="77" r="3" fill="#302d30"/><circle cx="208" cy="77" r="3" fill="#302d30"/><path d="M190 78 185 89 194 91M179 103Q190 108 201 103" stroke="#896252" stroke-width="2" fill="none"/>${style===0?'<g fill="none" stroke="#303b45" stroke-width="2"><rect x="157" y="70" width="30" height="17" rx="3"/><rect x="194" y="70" width="30" height="17" rx="3"/><path d="M187 76H194"/></g>':''}<path d="M120 141 157 127 170 185H136Z M260 141 223 127 210 185H244Z" fill="#16212d" opacity=".18"/></svg>`}
const option=(label,delta,news,lesson)=>({label,delta,news,lesson});
const card=(who,quote,options)=>({who,quote,options});
const first=card('industry','기업마다 AI 도입이 빨라지고 있습니다. 올해 추가된 교육 시간, 어디에 먼저 투자할까요?',[option('최신 AI 도구 실습',[15,0,0,7],'졸업생의 AI 실무 적응이 빨라졌습니다.','도구 활용은 실무 적응에 도움을 준다.'),option('문제 분해와 해결 프로젝트',[-3,4,0,16],'학생들의 컴퓨팅 사고력이 성장했습니다.','컴퓨팅 사고력은 새로운 문제에 대응하는 기반이다.')]);
const digital=[card('press','새로운 AI 서비스가 등장해 기존 사용법이 빠르게 낡았습니다. AI가 작성한 기사에 오류도 발견됐습니다. 다음 교육 시간은?', [option('새 도구 적응 실습',[12,-5,0,5],'새 기술에 빠르게 적응했지만 정보 검증의 부담은 남았습니다.','사용법만으로는 정보 판단과 윤리적 책임을 확보하기 어렵다.'),option('정보 검증·디지털 윤리',[-3,17,0,11],'시민들의 정보 검증 습관이 강화됐습니다. 최신 도구 실습 시간은 줄었습니다.','디지털 리터러시는 정보 판단과 책임 있는 활용까지 포함한다.')]),card('student','문제해결 수업은 도움이 됐지만 집에서 AI를 사용해 본 친구들과 경험 차이가 큽니다. 어떤 교육을 추가할까요?',[option('모두에게 AI 실습 기회 제공',[12,5,0,9],'기술 경험의 격차가 줄었습니다. 윤리 교육의 필요성은 여전히 남습니다.','기술 활용 기회와 역량을 함께 보장해야 한다.'),option('AI 정보 판단·윤리 프로젝트',[-3,16,0,10],'정보 판단 능력이 강화됐지만 기기 활용 경험의 차이는 남았습니다.','디지털 리터러시는 비판적 판단을 요구하며 접근성도 중요하다.')])];
const eco=card('teacher','폭염으로 학교 활동이 중단되는 날이 늘고 있습니다. 한정된 환경교육 예산을 어디에 사용할까요?',[option('전교생 생활 실천 교육',[2,6,8,7],'분리배출과 절약에 참여하는 학생이 크게 늘었습니다.','개인적 실천은 생태전환의 중요한 출발점이다.'),option('지역 생태계 탐구 프로젝트',[-6,3,16,12],'학생들이 인간과 자연의 관계, 지역의 생산·소비 구조를 탐구했습니다.','생태적 관점과 사회 참여 경험이 중요하다.')]);
const ecological=[card('resident','시민은 분리배출을 열심히 하지만 기업의 포장 폐기물은 줄지 않습니다. 다음 세대에게 무엇을 가르칠까요?',[option('시민 참여와 제도 변화',[-4,10,17,12],'시민들이 학교와 기업의 운영 방식 변화에도 참여합니다.','개인의 노력뿐 아니라 사회 구조의 전환이 필요하다.'),option('친환경 기술 개발 역량',[13,1,11,9],'친환경 소재 산업이 성장했습니다. 생산·소비 구조에 관한 논의는 남았습니다.','기술적 해결과 인식·구조의 변화는 상호 보완적이다.')]),card('eco','생태 탐구에 참여한 학생은 지역 변화에 적극적입니다. 하지만 예산 때문에 일부 학교만 참여합니다.',[option('모든 교과에 생태 관점 통합',[-5,10,12,15],'더 많은 학생이 생태적 관점을 배우게 됐습니다. 교사 연수 부담은 늘었습니다.','생태전환은 일부 체험이 아닌 교육 전반의 과제다.'),option('우수 생태 프로젝트 집중 지원',[7,-3,18,8],'혁신적인 지역 사례가 등장했습니다. 학교 간 기회 차이는 남았습니다.','생태적 실천을 사회 전체로 확산하는 교육이 필요하다.')])];
function finalCard(){return card('graduate','교육감님, 저는 예전에 그 학교에 다녔던 학생입니다. 이제 AI로 기후문제를 해결하는 일을 합니다. 기술도 에너지와 자원을 소비하더군요. 다음 세대에는 무엇을 우선할까요?',[option('AI 기반 환경문제 해결 프로젝트',[10,2,13,10],'학생들이 환경 데이터를 분석하고 해결책을 실험합니다. 기술의 환경 비용도 검토해야 합니다.','디지털·AI 소양은 생태문제 해결에 활용될 수 있다.'),option('기술과 생태의 영향 평가 수업',[-2,10,15,11],'학생들이 기술의 효과와 생태적 비용을 함께 판단합니다. 실제 기술 실습의 기회도 필요합니다.','생태적 관점은 기술 활용의 방향을 안내할 수 있다.')]);}
const years=[2026,2028,2030,2033,2035], labels=['경제','사회 신뢰','생태계','시민 역량'],colors=['#ddb66b','#87b6d0','#8cbd8c','#bf9ed2'],icons=['<path d="M3 24V12l8 4V8l8 4V3h5v21Z" fill="currentColor"/>','<path d="M14 3 25 8v8c0 6-11 11-11 11S3 22 3 16V8Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2"/>','<path d="M25 3C7 2 2 10 5 20 16 25 26 13 25 3Z" fill="currentColor"/><path d="M3 26 20 8" stroke="#131b26" stroke-width="2"/>','<circle cx="14" cy="8" r="5" fill="currentColor"/><path d="M3 26v-4a11 11 0 0 1 22 0v4Z" fill="currentColor"/>'];
let turn=-1,stats=[50,50,50,50],path=[],history=[],current=null;const app=document.getElementById('app');function getCard(){return [first,digital[path[0]||0],eco,ecological[path[2]||0],finalCard()][turn]}
function pick(i){if(turn<0||turn>=5)return;const o=current.options[i];path.push(i);history.push(o);stats=stats.map((v,k)=>Math.min(100,Math.max(0,v+o.delta[k])));turn++;render()}
function render(){if(turn<0){app.innerHTML=`<div class="intro">${portrait('graduate')}<h2>당신은 교육정책 결정자입니다.</h2><p>2026년, 세상은 빠르게 변합니다.<br>수업 시간과 교육 예산은 한정되어 있습니다.<br>무엇을 먼저 가르치겠습니까?</p><button class="full" id="start">임기 시작 · 2026</button></div><p class="hint">5번의 결정 · 약 2~3분 · 가상 미래 시뮬레이션</p>`;document.getElementById('start').onclick=()=>{turn=0;render()};return}
let meters=`<div class="meters">${labels.map((l,i)=>`<div class="meter" style="color:${colors[i]}"><svg viewBox="0 0 28 28">${icons[i]}</svg><div class="track" role="meter" aria-label="${l}" aria-valuenow="${stats[i]}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${stats[i]}%;background:${colors[i]}"></div></div>${l} ${stats[i]}</div>`).join('')}</div>`;if(turn===5){app.innerHTML=meters+`<div class="date">2036 / 임기 종료</div><article class="report"><div class="mini">2036 · 미래신문 특별호</div><h2>${path[0]===0?'기술과 함께 성장한 세대':'새로운 문제에 도전하는 세대'}</h2><div class="tag">10년의 교육 기록</div><h3>디지털 사회</h3><p>${history[1].news}</p><h3>생태 사회</h3><p>${history[3].news}</p><h3>두 교육의 만남</h3><p>${history[4].news}</p><hr><h3>당신의 선택이 남긴 교육적 과제</h3><p>${history[1].lesson} ${history[3].lesson} ${history[4].lesson}</p><hr><b>생각해 봅시다.</b><p>당신이 만든 사회에는 어떤 교육이 더 필요하며, 그 이유는 무엇인가요?</p><details><summary>나의 선택 기록</summary><ol class="timeline">${history.map(o=>`<li>${o.label}</li>`).join('')}</ol></details></article><button class="full" id="reset">2026년으로 돌아가기</button><p class="hint">교육용 가상 시나리오 · 지표는 실제 예측값이 아닙니다.</p>`;document.getElementById('reset').onclick=()=>{turn=0;stats=[50,50,50,50];path=[];history=[];render()};return}
current=getCard();app.innerHTML=meters+`<div class="date">${years[turn]} / 결정 ${turn+1}·5</div>${turn?`<div class="news"><b>NEWS UPDATE</b>${history[turn-1].news}</div>`:''}<div class="card" id="swipe"><div class="portrait">${portrait(current.who)}</div><div class="person">${people[current.who][0]}</div><div class="quote">${current.quote}</div><div class="preview" id="preview"></div></div><div class="choices">${current.options.map((o,i)=>`<button id="c${i}"><span>${i?'→':'←'}</span>${o.label}</button>`).join('')}</div><p class="hint">카드를 좌우로 밀거나 버튼을 터치하세요.<br>가상 교육 시뮬레이션 · TEST 0.3</p>`;document.getElementById('c0').onclick=()=>pick(0);document.getElementById('c1').onclick=()=>pick(1);let el=document.getElementById('swipe'),p=document.getElementById('preview'),start=null;el.onpointerdown=e=>{start=e.clientX;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(start===null)return;let d=e.clientX-start;el.style.transform=`translateX(${Math.max(-80,Math.min(80,d*.45))}px) rotate(${Math.max(-9,Math.min(9,d*.05))}deg)`;p.style.opacity=Math.min(1,Math.abs(d)/55);p.textContent=current.options[d>0?1:0].label};el.onpointerup=e=>{if(start===null)return;let d=e.clientX-start;start=null;el.style.transform='';p.style.opacity=0;if(Math.abs(d)>50)pick(d>0?1:0)};el.onpointercancel=()=>{start=null;el.style.transform='';p.style.opacity=0};}
render();</script></body></html>
